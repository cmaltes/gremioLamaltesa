name: Fallo en la web
description: Algo no se ve o no funciona
labels: ["tipo:fallo"]
body:
  - type: input
    id: url
    attributes: { label: Página donde ocurre }
    validations: { required: true }
  - type: input
    id: dispositivo
    attributes: { label: Dispositivo y navegador, placeholder: "iPhone SE, Safari" }
  - type: textarea
    id: desc
    attributes: { label: Qué pasa y qué debería pasar }
    validations: { required: true }
